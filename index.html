<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/app-icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Educator's Desk | Shittu Quadri Adeshina</title>
<style>
:root{--navy:#101d3a;--navy2:#192b50;--gold:#d9ad55;--bg:#f3f5f9;--ink:#18233b;--muted:#718096;--line:#e3e8f0;--white:#fff;--green:#16835d;--red:#c44747;--shadow:0 10px 28px #17274712}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:260px 1fr}
.sidebar{background:var(--navy);color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;padding:5px 8px 24px;border-bottom:1px solid #ffffff20}.brandmark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--gold),#f4d991);color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:18px}.brand h1{font-size:14px;line-height:1.25;margin:0}.brand small{color:#bdc8dc;font-size:11px}
.navlabel{color:#91a2bf;text-transform:uppercase;letter-spacing:1.4px;font-size:10px;font-weight:800;margin:22px 10px 8px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#dce4f2;text-align:left;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:11px;font-weight:600}.nav button:hover,.nav button.active{background:#ffffff17;color:#fff}.nav .ico{width:20px;text-align:center;color:var(--gold)}
.sidefoot{font-size:11px;color:#aab8cf;margin:26px 9px 0;line-height:1.6}
.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.topbar h2{font-size:17px;margin:0}.topright{display:flex;align-items:center;gap:12px}.avatar{width:37px;height:37px;border-radius:50%;background:#e9edf5;color:var(--navy);display:grid;place-items:center;font-weight:800}
.content{padding:28px;max-width:1500px;margin:auto}.welcome{background:linear-gradient(115deg,#142344,#263e69);color:white;border-radius:18px;padding:25px 28px;display:flex;justify-content:space-between;gap:18px;align-items:center;box-shadow:var(--shadow)}.welcome h2{margin:0 0 6px;font-size:23px}.welcome p{margin:0;color:#d4deed}.welcome .date{color:#f1d18c;font-weight:700;font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin:20px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow)}.stat .slabel{color:var(--muted);font-size:12px;font-weight:700}.stat strong{display:block;font-size:27px;margin-top:6px}.stat .sicon{float:right;background:#f7f0e2;color:#926b20;border-radius:10px;padding:8px}
.panel{background:#fff;border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panelhead h3{margin:0;font-size:16px}.muted{color:var(--muted)}.small{font-size:12px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.subject-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.subject-card{border:1px solid var(--line);border-radius:13px;padding:16px;background:#fff;transition:.2s}.subject-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.subject-card h4{margin:0 0 5px;font-size:15px}.subject-card p{margin:0 0 12px;color:var(--muted);font-size:12px}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{background:#eef2f8;color:#42516d;padding:4px 8px;border-radius:20px;font-size:11px}
.btn{border:0;border-radius:9px;padding:9px 13px;background:var(--navy);color:white;font-weight:700;font-size:13px}.btn:hover{filter:brightness(1.12)}.btn.gold{background:var(--gold);color:#19233a}.btn.light{background:#edf1f7;color:#263653}.btn.danger{background:#faeaea;color:#a33131}.btnline{display:flex;gap:8px;flex-wrap:wrap}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select{max-width:260px}
input,select,textarea{width:100%;border:1px solid #d9e0eb;border-radius:9px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:#7b94c1;box-shadow:0 0 0 3px #dce5f5}textarea{min-height:90px;resize:vertical}label{display:block;font-size:12px;font-weight:750;color:#52617b;margin-bottom:5px}.field{margin-bottom:12px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.formgrid .full{grid-column:1/-1}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{background:#f7f8fb;color:#596780;font-size:11px;text-transform:uppercase;letter-spacing:.5px}tr:last-child td{border-bottom:0}.empty{text-align:center;padding:30px;color:var(--muted)}
.subject-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}.subject-head h2{margin:0 0 4px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:8px;margin:0 0 16px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;color:#53617a;font-size:12px;font-weight:700}.tabs button.active{background:var(--navy);color:white;border-color:var(--navy)}
.notice{padding:12px 14px;border-radius:10px;background:#fff8e8;color:#75571d;font-size:12px;margin-bottom:15px;border:1px solid #f1dfb8}.hidden{display:none!important}.mobilemenu{display:none;background:none;border:0;font-size:22px;color:var(--navy)}
.modalback{position:fixed;inset:0;background:#0d1830a6;display:grid;place-items:center;padding:15px;z-index:20}.modal{background:#fff;border-radius:15px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px #0003}.modal h3{margin:0 0 16px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.toast{position:fixed;bottom:20px;right:20px;background:#142344;color:white;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:30}
@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.subject-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.app{display:block}.sidebar{position:fixed;z-index:15;left:-280px;width:260px;transition:left .2s}.sidebar.open{left:0}.topbar{padding:0 16px;height:62px}.mobilemenu{display:block}.content{padding:17px}.welcome{padding:20px;display:block}.welcome .date{display:block;margin-top:13px}.grid2{grid-template-columns:1fr}.subject-grid{grid-template-columns:1fr}.cards{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.formgrid{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.topbar h2{font-size:14px}}
@media print{.sidebar,.topbar,.no-print,.btn,.tabs{display:none!important}.app{display:block}.content{padding:0}.panel{box-shadow:none;border:0}.main{width:100%}body{background:#fff}}
.brandmark{overflow:hidden}.brandmark img{width:100%;height:100%;object-fit:cover}.avatar{object-fit:cover}.profile-photo{display:block;width:min(100%,300px);max-height:420px;object-fit:contain;border-radius:14px;margin:0 auto 12px}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brandmark"><img src="assets/app-icon-192.png" alt="Educator app icon"></div><div><h1>EDUCATOR'S DESK</h1><small>Teacher Management System</small></div></div>
  <div class="navlabel">Workspace</div>
  <nav class="nav" id="mainNav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
    <button data-page="subjects"><span class="ico">▤</span>My Subjects</button>
    <button data-page="students"><span class="ico">♙</span>Student Register</button>
    <button data-page="timetable"><span class="ico">◷</span>Teaching Timetable</button>
    <button data-page="calendar"><span class="ico">▣</span>Academic Calendar</button>
    <button data-page="development"><span class="ico">✦</span>Professional Growth</button>
  </nav>
  <div class="navlabel">Teacher tools</div>
  <nav class="nav">
    <button data-page="profile"><span class="ico">◎</span>Teacher Profile</button>
    <button data-page="firebase"><span class="ico">☁</span>Firebase Cloud Backup</button>
    <button id="backupBtn"><span class="ico">⇩</span>Backup Data</button>
    <button id="restoreBtn"><span class="ico">⇧</span>Restore Backup</button>
    <button id="printBtn"><span class="ico">⎙</span>Print Current Page</button>
  </nav>
  <div class="sidefoot">MAKNAZUL ’IRFAN ACADEMY<br>Personal teaching and academic record workspace.</div>
</aside>
<main class="main">
<header class="topbar"><div class="topright"><button class="mobilemenu" id="menuBtn">☰</button><h2 id="pageTitle">Dashboard</h2></div><div class="topright"><span class="small muted">Educator</span><img class="avatar" src="assets/app-icon-192.png" alt="Educator Shittu Quadri Adeshina"></div></header>
<div class="content" id="content"></div>
</main>
</div>
<input type="file" id="restoreFile" accept="application/json" class="hidden">
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const SUBJECTS=[
 {name:"Basic Science",code:"BSC",levels:["JSS 1","JSS 2","JSS 3"]},
 {name:"Civic Education",code:"CVE",levels:["JSS 1","JSS 2","JSS 3"]},
 {name:"Social Studies",code:"SST",levels:["JSS 1","JSS 2","JSS 3"]},
 {name:"Islamic Studies",code:"ISL",levels:["JSS 1","JSS 2","JSS 3","SS 1","SS 2","SS 3"]},
 {name:"Arabic Language",code:"ARB",levels:["JSS 1","JSS 2","JSS 3","SS 1","SS 2","SS 3"]},
 {name:"Tajweed (التجويد)",code:"TJW",levels:["JSS 1","JSS 2","JSS 3","SS 1","SS 2","SS 3"]},
 {name:"Imlā' (الإملاء)",code:"IML",levels:["JSS 1","JSS 2","JSS 3","SS 1","SS 2","SS 3"]},
 {name:"Nahw (النحو)",code:"NHW",levels:["JSS 1","JSS 2","JSS 3","SS 1","SS 2","SS 3"]},
 {name:"Sarf (الصرف)",code:"SRF",levels:["JSS 1","JSS 2","JSS 3","SS 1","SS 2","SS 3"]}
];
const MODULES=[
 ["schemes","Schemes of Work"],["notes","Lesson Notes"],["assignments","Assignments"],["assessments","Tests & Examinations"],["evaluations","Evaluation & Reflection"],["attendance","Attendance"],["resources","Teaching Resources"],["lessonlog","Lesson Delivery Log"],["revision","Revision & Question Bank"],["results","Student Results"]
];
const STORE="educator_shittu_desk_v1";
let db=loadDB(),page="dashboard",currentSubject=null,currentLevel=null,currentModule="schemes";
function fresh(){return {profile:{name:"Educator Shittu Quadri Adeshina",school:"",email:"",phone:"",qualification:"",specialisation:"Islamic Studies Education, Arabic Language and General Studies",bio:""},students:[],timetable:[],calendar:[],development:[],records:{}}}
function loadDB(){try{return {...fresh(),...JSON.parse(localStorage.getItem(STORE)||"{}")}}catch(e){return fresh()}}
function save(){localStorage.setItem(STORE,JSON.stringify(db));if(window.educatorCloudBackup)window.educatorCloudBackup()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function key(s,l,m){return s+"__"+l+"__"+m}
function rows(s,l,m){return db.records[key(s,l,m)]||[]}
function setRows(s,l,m,a){db.records[key(s,l,m)]=a;save()}
function toast(msg){let el=document.getElementById("toastRoot");el.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>el.innerHTML="",2600)}
function go(p){page=p;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));document.getElementById("sidebar").classList.remove("open");render()}
document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
document.getElementById("menuBtn").onclick=()=>document.getElementById("sidebar").classList.toggle("open");
document.getElementById("backupBtn").onclick=backup;document.getElementById("restoreBtn").onclick=()=>document.getElementById("restoreFile").click();
document.getElementById("restoreFile").onchange=restore;document.getElementById("printBtn").onclick=()=>window.print();
function render(){let title={dashboard:"Dashboard",subjects:"My Subjects",students:"Student Register",timetable:"Teaching Timetable",calendar:"Academic Calendar",development:"Professional Growth",profile:"Teacher Profile",firebase:"Firebase Cloud Backup"}[page]||"Subject Workspace";document.getElementById("pageTitle").textContent=title;let c=document.getElementById("content");if(page==="dashboard")c.innerHTML=dashboard();else if(page==="subjects")c.innerHTML=subjectsPage();else if(page==="students")c.innerHTML=globalPage("students");else if(page==="timetable")c.innerHTML=globalPage("timetable");else if(page==="calendar")c.innerHTML=globalPage("calendar");else if(page==="development")c.innerHTML=globalPage("development");else if(page==="profile")c.innerHTML=profilePage();else if(page==="firebase")c.innerHTML=firebasePage();else c.innerHTML=subjectPage();bindPage()}
function dashboard(){let recordCount=Object.values(db.records).reduce((n,a)=>n+(a||[]).length,0);let studentCount=db.students.length;let today=new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"});return `
<div class="welcome"><div><h2>Welcome back, ${esc((db.profile.name||"Educator").split(" ").slice(0,2).join(" "))}</h2><p>Your teaching activities, academic records and classroom resources in one workspace.</p></div><div class="date">${today}</div></div>
<div class="cards"><div class="stat"><span class="sicon">▤</span><div class="slabel">Subject Workspaces</div><strong>45</strong><span class="small muted">Across six class levels</span></div><div class="stat"><span class="sicon">♙</span><div class="slabel">Registered Students</div><strong>${studentCount}</strong><span class="small muted">In your student register</span></div><div class="stat"><span class="sicon">▣</span><div class="slabel">Teaching Records</div><strong>${recordCount}</strong><span class="small muted">Saved across workspaces</span></div><div class="stat"><span class="sicon">✦</span><div class="slabel">Development Records</div><strong>${db.development.length}</strong><span class="small muted">Courses and certificates</span></div></div>
<div class="grid2"><section class="panel"><div class="panelhead"><h3>Subject Workspaces</h3><button class="btn light" data-go="subjects">View all</button></div><div class="subject-grid">${SUBJECTS.slice(0,4).map(s=>`<div class="subject-card"><h4>${s.name}</h4><p>${s.levels.length} class levels</p><div class="chips">${s.levels.map(l=>`<span class="chip">${l}</span>`).join("")}</div></div>`).join("")}</div></section><section class="panel"><div class="panelhead"><h3>Quick Actions</h3></div><div class="btnline"><button class="btn" data-go="students">+ Add Student</button><button class="btn light" data-go="subjects">Open Subject</button><button class="btn light" data-go="timetable">Add Lesson Period</button><button class="btn light" data-go="calendar">Add Calendar Event</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3 style="font-size:14px">Getting started</h3><p class="small muted">Open a subject, select a class and choose a module. Each subject/class combination stores its own schemes, lesson notes, assessments, attendance and results.</p><div class="notice">Your records are saved in this browser on this device. Export a JSON backup regularly to protect your work and move it to another device.</div></section></div>
<section class="panel"><div class="panelhead"><h3>Recently Added Records</h3><span class="small muted">Latest 5 entries</span></div>${recentRecords()}</section>`}
function recentRecords(){let all=[];Object.entries(db.records).forEach(([k,a])=>(a||[]).forEach(x=>all.push({...x,_key:k})));all.sort((a,b)=>(b.created||"").localeCompare(a.created||""));if(!all.length)return `<div class="empty">No teaching records yet. Start by opening a subject workspace.</div>`;return `<div class="tablewrap"><table><thead><tr><th>Record</th><th>Title / Topic</th><th>Subject & Class</th><th>Date</th></tr></thead><tbody>${all.slice(0,5).map(x=>{let p=x._key.split("__");return `<tr><td>${esc(x.type||"Entry")}</td><td>${esc(x.title||x.topic||x.name||"Untitled")}</td><td>${esc(p[0])} · ${esc(p[1])}</td><td>${esc(x.date||x.created||"—")}</td></tr>`}).join("")}</tbody></table></div>`}
function subjectsPage(){return `<div class="panel"><div class="panelhead"><div><h3>My Teaching Subjects</h3><div class="small muted">Choose a subject and class to open its independent workspace.</div></div></div><div class="subject-grid">${SUBJECTS.map(s=>`<div class="subject-card"><h4>${s.name}</h4><p>${s.code} · ${s.levels.length} applicable classes</p><div class="chips">${s.levels.map(l=>`<button class="chip" style="border:0;cursor:pointer" data-open="${esc(s.name)}" data-level="${l}">${l}</button>`).join("")}</div></div>`).join("")}</div></div>`}
function openSubject(s,l){currentSubject=s;currentLevel=l;currentModule="schemes";page="workspace";render()}
function subjectPage(){let s=SUBJECTS.find(x=>x.name===currentSubject);if(!s){page="subjects";return subjectsPage()}return `<div class="subject-head"><div><div class="small muted">SUBJECT WORKSPACE</div><h2>${esc(currentSubject)} <span class="muted">/</span> ${esc(currentLevel)}</h2><div class="small muted">Independent academic records for this subject and class.</div></div><div class="btnline no-print"><button class="btn light" data-go="subjects">← All Subjects</button><button class="btn gold" data-add-record>+ Add Record</button></div></div><div class="tabs">${MODULES.map(([id,n])=>`<button data-module="${id}" class="${id===currentModule?"active":""}">${n}</button>`).join("")}</div><div id="moduleContent">${moduleContent()}</div>`}
function moduleContent(){if(currentModule==="schemes")return schemeEditor();let data=rows(currentSubject,currentLevel,currentModule);let fields=moduleFields(currentModule);return `<section class="panel"><div class="panelhead"><div><h3>${MODULES.find(x=>x[0]===currentModule)[1]}</h3><div class="small muted">${data.length} saved record(s)</div></div><button class="btn" data-add-record>+ Add New</button></div>${data.length?`<div class="tablewrap"><table><thead><tr>${fields.slice(0,4).map(f=>`<th>${f.label}</th>`).join("")}<th>Actions</th></tr></thead><tbody>${data.map((r,i)=>`<tr>${fields.slice(0,4).map(f=>`<td>${esc(r[f.name]||"—")}</td>`).join("")}<td><div class="btnline">${currentModule==="notes"?`<button class="btn gold" data-pdf="${i}">Download PDF</button>`:""}<button class="btn light" data-edit="${i}">Edit</button><button class="btn danger" data-delete="${i}">Delete</button></div></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No ${MODULES.find(x=>x[0]===currentModule)[1].toLowerCase()} recorded for ${esc(currentLevel)} yet.</div>`}</section>`}
function schemeEditor(){let data=rows(currentSubject,currentLevel,"schemes"),term=data[0]?.term||"First Term";let weeks=Array.from({length:10},(_,i)=>{let r=data.find(x=>Number(String(x.week).match(/\d+/)?.[0])===i+1)||{};return `<tr><td><strong>Week ${i+1}</strong><input type="hidden" class="sw-week" value="Week ${i+1}"></td><td><input class="sw-topic" data-week="${i+1}" value="${esc(r.topic||"")}" placeholder="Enter or paste topic"></td><td><textarea class="sw-subtopic" data-week="${i+1}" rows="2" placeholder="Enter or paste subtopic(s)">${esc(r.subtopic||"")}</textarea></td></tr>`}).join("");return `<section class="panel"><div class="panelhead"><div><h3>10-Week Scheme of Work</h3><div class="small muted">${esc(currentSubject)} · ${esc(currentLevel)} · Enter each week separately or paste all ten weeks together.</div></div></div><div class="formgrid"><div class="field"><label>Term</label><select id="schemeTerm"><option ${term==="First Term"?"selected":""}>First Term</option><option ${term==="Second Term"?"selected":""}>Second Term</option><option ${term==="Third Term"?"selected":""}>Third Term</option></select></div></div><div class="notice">You can type or paste a topic and subtopic into each week. For group entry, use the bulk-paste boxes below. Each line corresponds to Week 1 through Week 10.</div><div class="tablewrap"><table style="min-width:650px"><thead><tr><th style="width:90px">Week</th><th>Topic</th><th>Subtopic(s)</th></tr></thead><tbody>${weeks}</tbody></table></div><div class="btnline no-print" style="margin-top:14px"><button class="btn gold" id="saveSchemeWeeks">Save 10-Week Scheme</button><button class="btn light" id="clearSchemeWeeks">Clear All Weeks</button><button class="btn light" id="printScheme">Print Scheme</button></div></section><section class="panel"><div class="panelhead"><div><h3>Bulk Paste Topics and Subtopics</h3><div class="small muted">Paste each list separately, or paste topics and subtopics together.</div></div></div><div class="formgrid"><div class="field"><label>Paste 10 topics (one topic per line)</label><textarea id="bulkTopics" rows="8" placeholder="Week 1 topic&#10;Week 2 topic&#10;Week 3 topic&#10;...&#10;Week 10 topic"></textarea><button class="btn light" type="button" id="applyTopics">Apply Topics Only</button></div><div class="field"><label>Paste 10 subtopics (one week per line)</label><textarea id="bulkSubtopics" rows="8" placeholder="Week 1 subtopics&#10;Week 2 subtopics&#10;Week 3 subtopics&#10;...&#10;Week 10 subtopics"></textarea><button class="btn light" type="button" id="applySubtopics">Apply Subtopics Only</button></div><div class="field full"><label>Paste topics and subtopics together (one week per line)</label><textarea id="bulkGrouped" rows="7" placeholder="Week 1 | Topic | Subtopic(s)&#10;Week 2 | Topic | Subtopic(s)&#10;Week 3 | Topic | Subtopic(s)&#10;...&#10;Week 10 | Topic | Subtopic(s)"></textarea><button class="btn" type="button" id="applyGrouped">Apply Grouped Topics & Subtopics</button></div></div><p class="small muted">Grouped format: Week number | Topic | Subtopic(s). You may also use tab-separated columns. Applying pasted content fills the matching week rows; press Save 10-Week Scheme afterwards.</p></section>`}
function moduleFields(m){let common={
schemes:[["term","Term","select","First Term|Second Term|Third Term"],["week","Week","text"],["topic","Topic","text"],["subtopic","Subtopic","text"],["objectives","Learning Objectives","textarea"],["activities","Teaching/Learning Activities","textarea"],["resources","Instructional Resources","textarea"],["evaluation","Evaluation","textarea"],["status","Status","select","Planned|In Progress|Completed"]],
notes:[["title","Lesson Title","text"],["date","Date","date"],["duration","Duration","text"],["topic","Topic","text"],["objectives","Behavioural Objectives","textarea"],["previous","Previous Knowledge","textarea"],["materials","Teaching Materials","textarea"],["introduction","Introduction / Set Induction","textarea"],["presentation","Lesson Presentation / Steps","textarea"],["evaluation","Evaluation Questions","textarea"],["conclusion","Conclusion","textarea"],["assignment","Assignment","textarea"]],
assignments:[["title","Assignment Title","text"],["date","Date Issued","date"],["due","Due Date","date"],["topic","Topic","text"],["instructions","Questions / Instructions","textarea"],["marks","Total Marks","number"]],
